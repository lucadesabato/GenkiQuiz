<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Genki - Quiz Vocabolario</title>
<style>
  * { box-sizing: border-box; }

<body>
<div id="app"></div>

<script src="data-vocab.js"></script>
<script src="data-kanji.js"></script>
<script src="data-grammar.js"></script>
<script src="data-verbs.js"></script>
<script src="data-adjectives.js"></script>
<script>
// ===================== MOTORE DEL QUIZ =====================
// I database (vocabolario, kanji, grammatica) sono caricati dai file
// data-vocab.js, data-kanji.js, data-grammar.js prima di questo script.
const STORAGE_KEY = "genki_quiz_history";

// Formatta una parola come "かな (漢字)" se ha il kanji, altrimenti solo "かな"
function jpLabel(word) {
  return word.kanji ? `${word.jp} (${word.kanji})` : word.jp;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveResult(mode, score, total) {
  const history = loadHistory();
  history.unshift({ date: new Date().toLocaleDateString('it-IT'), mode, score, total });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 10)));
}

let state = {
  screen: "mode",
  mode: "vocab",      // "vocab" | "kanji" | "grammar" | "verbs" | "adjectives" | "scrittura"
  maxLesson: 12,      // filtra i contenuti fino a questa lezione inclusa
  totalItems: 20,
  questions: [],
  idx: 0,
  score: 0,
  answered: false
};

// Costruisce N domande di vocabolario (kana/kanji <-> italiano)
function buildVocabQuestions(n) {
  const fullPool = VOCAB_ALL;
  const pool = fullPool.filter(w => w.lesson <= state.maxLesson);
  const words = shuffle(pool).slice(0, Math.min(n, pool.length));
  return words.map(w => {
    const dir = Math.random() < 0.5 ? "jp2it" : "it2jp";
    const valueOf = (p) => dir === "jp2it" ? p.it : jpLabel(p);
    const correctValue = valueOf(w);

    // Se la parola appartiene a una categoria "stretta" (numeri, giorni, mesi, famiglia,
    // paesi, colori), preferisci distrattori dalla STESSA categoria: molto più difficili
    // da eliminare a colpo d'occhio rispetto a parole scelte a caso da tutto il pool.
    // I distrattori pescano dal pool COMPLETO (non filtrato per lezione), solo la parola
    // da indovinare è limitata alle lezioni selezionate.
    let candidatePool = fullPool.filter(p => valueOf(p) !== correctValue);
    if (w.cat) {
      const sameCat = candidatePool.filter(p => p.cat === w.cat);
      if (sameCat.length >= 3) candidatePool = sameCat;
    }
    const distractors = shuffle(candidatePool).slice(0, 3).map(valueOf);
    const options = shuffle([correctValue, ...distractors]);
    return {
      promptLabel: dir === "jp2it" ? "Cosa significa?" : "Come si dice in giapponese?",
      mainText: dir === "jp2it" ? jpLabel(w) : w.it,
      hintText: null,
      correctValue,
      options
    };
  });
}

// Domande tipo 1: mostra il kanji da solo, risposta = lettura (on/kun) + significato
function buildKanjiReadingQuestions(pool, count) {
  const chosen = shuffle(pool).slice(0, count);
  return chosen.map(k => {
    const valueOf = (p) => `${p.onkun} — ${p.meaning}`;
    const correctValue = valueOf(k);
    const otherPool = pool.filter(p => p !== k);
    const distractors = shuffle(otherPool).slice(0, 3).map(valueOf);
    const options = shuffle([correctValue, ...distractors]);
    return {
      promptLabel: "Qual è la lettura e il significato di questo kanji?",
      mainText: k.kanji,
      hintText: null,
      correctValue,
      options
    };
  });
}

// Domande tipo 2: mostra una parola di esempio con quel kanji, risposta = traduzione italiana
function buildKanjiExampleQuestions(pool, count) {
  // Costruisce un pool piatto di tutti gli esempi, ESCLUDENDO quelli "auto-referenziali"
  // (dove la parola d'esempio è il kanji da solo, es. 山 -> 山): quell'informazione
  // è già coperta dalla domanda "lettura", mostrarla di nuovo qui sembra una ripetizione.
  // Alcune parole (es. 男の子) sono elencate come esempio sotto più kanji contemporaneamente
  // (usa sia 男 sia 子): deduplica per parola così non può uscire due volte nella stessa sessione.
  const rawExamples = pool.flatMap(k => k.examples.filter(ex => ex.word !== k.kanji));
  const seenWords = new Set();
  const allExamples = rawExamples.filter(ex => {
    if (seenWords.has(ex.word)) return false;
    seenWords.add(ex.word);
    return true;
  });
  const chosen = shuffle(allExamples).slice(0, count);
  return chosen.map(ex => {
    // La domanda mostra SOLO il kanji/la parola, mai la lettura: lettura + significato
    // vanno indovinati insieme, combinati in ogni opzione di risposta.
    const labelOf = (e) => `${e.reading} — ${e.it}`;
    const correctValue = labelOf(ex);
    const otherPool = allExamples.filter(e => labelOf(e) !== correctValue);
    const distractors = shuffle(otherPool).slice(0, 3).map(labelOf);
    const options = shuffle([correctValue, ...distractors]);
    return {
      promptLabel: "Come si legge questa parola, e cosa significa?",
      mainText: ex.word,
      hintText: null,
      correctValue,
      options
    };
  });
}

// Costruisce N domande sui kanji, mescolando i due tipi
function buildKanjiQuestions(n) {
  const pool = KANJI_ALL.filter(k => k.lesson <= state.maxLesson);
  const half = Math.round(n / 2);
  const readingQs = buildKanjiReadingQuestions(pool, half);
  const exampleQs = buildKanjiExampleQuestions(pool, n - half);
  return shuffle([...readingQs, ...exampleQs]);
}

// ===================== CONIUGAZIONE (verbi e aggettivi) =====================
// Ogni verbo/aggettivo pescato genera un GRUPPO di 3 domande fisse e collegate:
//  1) che tipo è (ru/u/irregolare oppure い/な)
//  2) una forma coniugata a caso (tra quelle con un significato proprio, quindi mai て)
//  3) cosa significa quella forma
// Il gruppo conta come UNA sola "domanda" nel conteggio totale scelto dall'utente.
const VERB_TYPE_LABELS = { ru: "ru-verbo", u: "u-verbo", irr: "irregolare" };
const ADJ_TYPE_LABELS = { i: "い-aggettivo", na: "な-aggettivo" };

// Solo forme con un significato proprio isolato: て è esclusa (va bene come distrattore, non come target)
const VERB_FORM_DEFS = [
  { key: "masu", label: "Qual è la forma presente affermativa (educata)?" },
  { key: "masen", label: "Qual è la forma presente negativa (educata)?" },
  { key: "mashita", label: "Qual è la forma passata affermativa (educata)?" },
  { key: "masendeshita", label: "Qual è la forma passata negativa (educata)?" },
  { key: "ta", label: "Qual è la forma del passato informale (quella che usi con gli amici)?" }
];

const ADJ_FORM_DEFS = [
  { key: "pres_aff", label: "Qual è la forma presente affermativa?" },
  { key: "pres_neg", label: "Qual è la forma presente negativa?" },
  { key: "past_aff", label: "Qual è la forma passata affermativa?" },
  { key: "past_neg", label: "Qual è la forma passata negativa?" }
];

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// Domanda sull'USO della forma て (non sul suo "significato", che non esiste in isolamento):
// mostra la forma て inserita in una delle 4 costruzioni tipiche e chiede cosa significa la frase risultante.
function buildTeUsageQuestion(w) {
  const patterns = ["sequence", "request", "permission", "progressive"];
  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  if (pattern === "sequence") {
    const others = VERBS_ALL.filter(v => v !== w && v.teUses);
    const w2 = others[Math.floor(Math.random() * others.length)];
    const mainText = w.forms.te + "、" + w2.forms.masu + "。";
    const correctValue = capitalize(w.meanings.masu) + " e poi " + w2.meanings.masu;
    const swapped = capitalize(w2.meanings.masu) + " e poi " + w.meanings.masu;
    const others2 = VERBS_ALL.filter(v => v.teUses && v !== w && v !== w2);
    const extra = shuffle(others2).slice(0, 2);
    const distractor2 = capitalize(w.meanings.masu) + " e poi " + (extra[0] ? extra[0].meanings.masu : w2.meanings.masen);
    const distractor3 = capitalize((extra[1] || extra[0] || w2).meanings.masu) + " e poi " + w2.meanings.masu;
    const options = shuffle([...new Set([correctValue, swapped, distractor2, distractor3])]);
    return {
      promptLabel: "Cosa significa questa frase (due azioni collegate)?",
      mainText,
      hintText: null,
      correctValue,
      options
    };
  }

  const suffix = pattern === "request" ? "ください。" : pattern === "permission" ? "もいいです。" : "いる。";
  const mainText = w.forms.te + suffix;
  const correctValue = w.teUses[pattern];
  const otherPool = VERBS_ALL.filter(v => v.teUses && v !== w);
  const distractors = shuffle(otherPool).slice(0, 3).map(v => v.teUses[pattern]);
  const promptLabel = pattern === "request" ? "Cosa significa questa richiesta?"
    : pattern === "permission" ? "Cosa significa questo permesso?"
    : "Cosa significa questa azione in corso?";
  return {
    promptLabel,
    mainText,
    hintText: null,
    correctValue,
    options: shuffle([correctValue, ...distractors])
  };
}

// Costruisce le 3 domande per UN singolo verbo
function buildVerbGroup(w) {
  const typeQ = {
    promptLabel: "Che tipo di verbo è questo?",
    mainText: jpLabel(w),
    hintText: null,
    correctValue: VERB_TYPE_LABELS[w.type],
    options: shuffle(Object.values(VERB_TYPE_LABELS))
  };

  // Se il verbo ha usi della forma て definiti (esclusi i verbi statici tipo ある/いる/ふる),
  // て entra come sesta opzione possibile, con probabilità pari alle altre 5 forme.
  const availableDefs = w.teUses
    ? [...VERB_FORM_DEFS, { key: "te", label: "Qual è la forma che collega azioni o introduce richieste/permessi?" }]
    : VERB_FORM_DEFS;
  const def = availableDefs[Math.floor(Math.random() * availableDefs.length)];

  const correct = w.forms[def.key];
  const allForms = Object.keys(w.forms).filter(k => k !== def.key).map(k => w.forms[k]);
  const uniqueOtherForms = [...new Set(allForms)].filter(v => v !== correct);
  const formDistractors = shuffle(uniqueOtherForms).slice(0, 3);
  const formQ = {
    promptLabel: def.label,
    mainText: jpLabel(w),
    hintText: null,
    correctValue: correct,
    options: shuffle([correct, ...formDistractors])
  };

  if (def.key === "te") {
    const usageQ = buildTeUsageQuestion(w);
    return [typeQ, formQ, usageQ];
  }

  const meaning = w.meanings[def.key];
  const allMeanings = Object.keys(w.meanings).filter(k => k !== def.key && w.meanings[k]).map(k => w.meanings[k]);
  const uniqueOtherMeanings = [...new Set(allMeanings)].filter(v => v !== meaning);
  const meaningDistractors = shuffle(uniqueOtherMeanings).slice(0, 3);
  const meaningQ = {
    promptLabel: "Cosa significa questa forma?",
    mainText: correct,
    hintText: null,
    correctValue: meaning,
    options: shuffle([meaning, ...meaningDistractors])
  };

  return [typeQ, formQ, meaningQ];
}

// Costruisce le 3 domande per UN singolo aggettivo
function buildAdjGroup(w) {
  const typeQ = {
    promptLabel: "Che tipo di aggettivo è questo?",
    mainText: jpLabel(w),
    hintText: null,
    correctValue: ADJ_TYPE_LABELS[w.type],
    options: shuffle(Object.values(ADJ_TYPE_LABELS))
  };

  const def = ADJ_FORM_DEFS[Math.floor(Math.random() * ADJ_FORM_DEFS.length)];
  const correct = w.forms[def.key];
  const allForms = Object.keys(w.forms).filter(k => k !== def.key).map(k => w.forms[k]);
  const uniqueOtherForms = [...new Set(allForms)].filter(v => v !== correct);
  const formDistractors = shuffle(uniqueOtherForms).slice(0, 3);
  const formQ = {
    promptLabel: def.label,
    mainText: jpLabel(w),
    hintText: null,
    correctValue: correct,
    options: shuffle([correct, ...formDistractors])
  };

  const meaning = w.meanings[def.key];
  const allMeanings = Object.keys(w.meanings).filter(k => k !== def.key && w.meanings[k]).map(k => w.meanings[k]);
  const uniqueOtherMeanings = [...new Set(allMeanings)].filter(v => v !== meaning);
  const meaningDistractors = shuffle(uniqueOtherMeanings).slice(0, 3);
  const meaningQ = {
    promptLabel: "Cosa significa questa forma?",
    mainText: correct,
    hintText: null,
    correctValue: meaning,
    options: shuffle([meaning, ...meaningDistractors])
  };

  return [typeQ, formQ, meaningQ];
}

// Costruisce N gruppi di VERBI (N = quanti verbi, scelto dall'utente), mai ripetuti nella stessa sessione.
// Ogni gruppo produce sempre 3 domande consecutive; il conteggio "Domanda X/N" mostrato
// all'utente si riferisce al numero di GRUPPI, non al numero di domande individuali.
function buildVerbConjugationQuestions(n) {
  const pool = VERBS_ALL.filter(w => w.lesson <= state.maxLesson);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  const groups = chosen.map(w => buildVerbGroup(w));
  const flat = [];
  groups.forEach((steps, gi) => {
    steps.forEach((step, si) => {
      flat.push({ ...step, groupIndex: gi + 1, groupTotal: groups.length, stepInGroup: si + 1, stepsInGroup: 3 });
    });
  });
  return flat;
}

// Stessa logica, per gli AGGETTIVI.
function buildAdjConjugationQuestions(n) {
  const pool = ADJECTIVES_ALL.filter(w => w.lesson <= state.maxLesson);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  const groups = chosen.map(w => buildAdjGroup(w));
  const flat = [];
  groups.forEach((steps, gi) => {
    steps.forEach((step, si) => {
      flat.push({ ...step, groupIndex: gi + 1, groupTotal: groups.length, stepInGroup: si + 1, stepsInGroup: 3 });
    });
  });
  return flat;
}
// ==============================================================================


// ===================== SCRITTURA (input libero, match esatto) =====================
// Pool combinato: Vocabolario + Verbi + Aggettivi, escludendo le voci che sono
// suffissi/particelle legate (es. "〜ねんせい") che non ha senso scrivere da sole.
function buildScritturaPool(maxLesson) {
  const combined = [...VOCAB_ALL, ...VERBS_ALL, ...ADJECTIVES_ALL];
  const lessonLimit = maxLesson || 10;
  return combined.filter(w => w.jp && !w.jp.includes("〜") && !w.it.includes("...") && w.lesson <= lessonLimit);
}

function buildScritturaQuestions(n) {
  const pool = buildScritturaPool(state.maxLesson);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  return chosen.map(w => {
    const accepted = [w.jp, w.kanji].filter(Boolean);
    // Formato per il feedback: "kanji / かな" se esiste il kanji, altrimenti solo la kana.
    const displayAnswer = w.kanji ? `${w.kanji} / ${w.jp}` : w.jp;
    return {
      promptLabel: "Come si scrive in giapponese?",
      mainText: w.it,
      hintText: null,
      correctValue: w.jp, // valore "principale" usato per il match
      displayAnswer, // mostrato sempre nel feedback, corretto o sbagliato che sia
      acceptedAnswers: accepted, // hiragana O kanji, va bene uno dei due
      inputType: "text"
    };
  });
}
// ==============================================================================

function buildQuestions(mode, n) {
  if (mode === "kanji") return buildKanjiQuestions(n);
  if (mode === "grammar") return buildGrammarQuestions(n);
  if (mode === "verbs") return buildVerbConjugationQuestions(n);
  if (mode === "adjectives") return buildAdjConjugationQuestions(n);
  if (mode === "scrittura") return buildScritturaQuestions(n);
  return buildVocabQuestions(n);
}

// Costruisce N domande di grammatica pescando dal pool già pronto (GRAMMAR_ALL), filtrate per lezione
function buildGrammarQuestions(n) {
  const pool = GRAMMAR_ALL.filter(q => q.lesson <= state.maxLesson);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  return chosen.map(q => ({
    promptLabel: q.point,
    mainText: q.prompt,
    hintText: null,
    correctValue: q.correct,
    options: shuffle(q.options),
    explanation: q.explanation
  }));
}

function modeTitle(mode) {
  if (mode === "kanji") return "Kanji";
  if (mode === "grammar") return "Grammatica";
  if (mode === "verbs") return "Verbi";
  if (mode === "adjectives") return "Aggettivi";
  if (mode === "scrittura") return "Scrittura";
  return "Vocabolario";
}

function render() {
  const app = document.getElementById("app");

  // Configurazione centralizzata per ciascuna modalità del quiz
  const MODES = {
    vocab: {
      title: "Vocabolario",
      lessons: "Lezioni 1-12",
      maxLesson: 12,
      max: VOCAB_ALL.length,
      menuLabel: `Vocabolario (${VOCAB_ALL.length} parole)`,
      countLabel: `${VOCAB_ALL.length} vocaboli disponibili`,
      setupQuestion: "Quanti vocaboli vuoi testare?"
    },
    kanji: {
      title: "Kanji",
      lessons: "Lezioni 3-12",
      maxLesson: 12,
      minLesson: 3, // i kanji iniziano dalla Lezione 3, non ha senso partire da 1
      max: KANJI_ALL.length * 2, // metà domande "lettura", metà "esempio"
      menuLabel: `Kanji (${KANJI_ALL.length} kanji, Lez. 3-12)`,
      countLabel: `${KANJI_ALL.length} kanji disponibili`,
      setupQuestion: "Quante domande vuoi (lettura + esempi)?"
    },
    grammar: {
      title: "Grammatica",
      lessons: "Lezioni 1-12",
      maxLesson: 12,
      max: GRAMMAR_ALL.length,
      menuLabel: `Grammatica (${GRAMMAR_ALL.length} domande, Lez. 1-12)`,
      countLabel: `${GRAMMAR_ALL.length} domande disponibili`,
      setupQuestion: "Quante domande di grammatica vuoi?"
    },
    verbs: {
      title: "Verbi",
      lessons: "Lezioni 3-12",
      maxLesson: 12,
      max: VERBS_ALL.length,
      menuLabel: `Verbi (${VERBS_ALL.length} verbi)`,
      countLabel: `${VERBS_ALL.length} verbi disponibili`,
      setupQuestion: "Quanti verbi vuoi ripassare? (ognuno = 3 domande: tipo, forma, significato)"
    },
    adjectives: {
      title: "Aggettivi",
      lessons: "Lezioni 3-12",
      maxLesson: 12,
      max: ADJECTIVES_ALL.length,
      menuLabel: `Aggettivi (${ADJECTIVES_ALL.length} aggettivi)`,
      countLabel: `${ADJECTIVES_ALL.length} aggettivi disponibili`,
      setupQuestion: "Quanti aggettivi vuoi ripassare? (ognuno = 3 domande: tipo, forma, significato)"
    },
    scrittura: {
      title: "Scrittura",
      lessons: "Lezioni 1-12",
      maxLesson: 12,
      max: buildScritturaPool().length,
      menuLabel: `Scrittura (${buildScritturaPool().length} parole, scrivi tu la risposta)`,
      countLabel: `${buildScritturaPool().length} parole disponibili`,
      setupQuestion: "Quante parole vuoi scrivere?"
    }
  };

  if (state.screen === "mode") {
    app.innerHTML = `
      <h1>Genki I &mdash; Quiz</h1>
      <p class="subtitle">Lezioni 1-12 &middot; scegli cosa allenare</p>
      <div class="card">
        <button id="vocabBtn">${MODES.vocab.menuLabel}</button>
        <div style="height:10px"></div>
        <button id="kanjiBtn" class="secondary">${MODES.kanji.menuLabel}</button>
        <div style="height:10px"></div>
        <button id="grammarBtn" class="secondary">${MODES.grammar.menuLabel}</button>
        <div style="height:10px"></div>
        <button id="verbsBtn" class="secondary">${MODES.verbs.menuLabel}</button>
        <div style="height:10px"></div>
        <button id="adjectivesBtn" class="secondary">${MODES.adjectives.menuLabel}</button>
        <div style="height:10px"></div>
        <button id="scritturaBtn" class="secondary">${MODES.scrittura.menuLabel}</button>
      </div>
    `;
    ["vocab", "kanji", "grammar", "verbs", "adjectives", "scrittura"].forEach(m => {
      document.getElementById(m + "Btn").onclick = () => {
        state.mode = m;
        state.screen = "chapters";
        render();
      };
    });
    return;
  }

  if (state.screen === "chapters") {
    const cfg = MODES[state.mode];
    const startLesson = cfg.minLesson || 1;
    const buttons = [];
    for (let i = startLesson; i <= cfg.maxLesson; i++) {
      const label = i === startLesson ? `${startLesson}` : `${startLesson}-${i}`;
      buttons.push(`<button class="secondary chapterBtn" data-lesson="${i}">${label}</button>`);
    }
    app.innerHTML = `
      <h1>Genki I &mdash; ${cfg.title}</h1>
      <p class="subtitle">Che capitoli vuoi trattare?</p>
      <div class="card">
        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
          ${buttons.join("")}
        </div>
      </div>
      <button id="backToModeBtn" class="secondary">&larr; Torna al menu</button>
    `;
    document.querySelectorAll(".chapterBtn").forEach(btn => {
      btn.style.padding = "14px 4px";
      btn.style.margin = "0";
      btn.style.fontSize = "15px";
      btn.onclick = () => {
        state.maxLesson = parseInt(btn.dataset.lesson, 10);
        state.screen = "setup";
        render();
      };
    });
    document.getElementById("backToModeBtn").onclick = () => {
      state.screen = "mode";
      render();
    };
    return;
  }

  if (state.screen === "setup") {
    const cfg = MODES[state.mode];
    // Ricalcola quante domande sono DAVVERO disponibili con i capitoli selezionati
    const filteredMax = (() => {
      if (state.mode === "vocab") return VOCAB_ALL.filter(w => w.lesson <= state.maxLesson).length;
      if (state.mode === "kanji") return KANJI_ALL.filter(k => k.lesson <= state.maxLesson).length * 2;
      if (state.mode === "grammar") return GRAMMAR_ALL.filter(q => q.lesson <= state.maxLesson).length;
      if (state.mode === "verbs") return VERBS_ALL.filter(w => w.lesson <= state.maxLesson).length;
      if (state.mode === "adjectives") return ADJECTIVES_ALL.filter(w => w.lesson <= state.maxLesson).length;
      if (state.mode === "scrittura") return buildScritturaPool(state.maxLesson).length;
      return cfg.max;
    })();
    const chapterLabel = state.maxLesson === 1 ? "Capitolo 1" : `Capitoli 1-${state.maxLesson}`;
    const history = loadHistory().filter(h => (h.mode || "Vocabolario") === modeTitle(state.mode));

    if (filteredMax === 0) {
      app.innerHTML = `
        <h1>Genki I &mdash; ${cfg.title}</h1>
        <p class="subtitle">${chapterLabel}</p>
        <div class="card">
          <p style="margin:0;">Non ci sono contenuti disponibili in questo intervallo di capitoli per questa modalità. Prova a scegliere un intervallo più ampio.</p>
        </div>
        <button id="backBtn" class="secondary">&larr; Cambia capitoli</button>
      `;
      document.getElementById("backBtn").onclick = () => {
        state.screen = "chapters";
        render();
      };
      return;
    }

    app.innerHTML = `
      <h1>Genki I &mdash; ${cfg.title}</h1>
      <p class="subtitle">${chapterLabel} &middot; ${filteredMax} disponibili</p>
      <div class="card">
        <label for="numItems">${cfg.setupQuestion}</label>
        <input type="number" id="numItems" min="1" max="${filteredMax}" value="${Math.min(state.totalItems, filteredMax)}">
        <button id="startBtn">Inizia il quiz</button>
      </div>
      ${history.length ? `
      <div class="card">
        <div style="font-size:14px; font-weight:600; margin-bottom:8px;">Cronologia (${modeTitle(state.mode)})</div>
        <div class="history">
          ${history.map(h => `<div class="history-row"><span>${h.date}</span><span>${h.score} / ${h.total}</span></div>`).join("")}
        </div>
      </div>` : ""}
      <button id="backBtn" class="secondary">&larr; Cambia capitoli</button>
    `;
    document.getElementById("startBtn").onclick = () => {
      const input = document.getElementById("numItems");
      let n = parseInt(input.value, 10);
      if (!n || n < 1) n = 5;
      if (n > filteredMax) n = filteredMax;
      state.totalItems = n;
      state.questions = buildQuestions(state.mode, n);
      state.idx = 0;
      state.score = 0;
      state.answered = false;
      state.screen = "quiz";
      render();
    };
    document.getElementById("backBtn").onclick = () => {
      state.screen = "chapters";
      render();
    };
    return;
  }

  if (state.screen === "quiz") {
    const q = state.questions[state.idx];
    const progressLabel = q.groupIndex
      ? `Parola ${q.groupIndex} / ${q.groupTotal} &middot; passo ${q.stepInGroup}/${q.stepsInGroup}`
      : `Domanda ${state.idx + 1} / ${state.questions.length}`;

    if (q.inputType === "text") {
      app.innerHTML = `
        <div class="progress">
          <span>${progressLabel}</span>
          <span>Punteggio: ${state.score}</span>
        </div>
        <div class="question-box">
          <p class="question-hint">${q.promptLabel}</p>
          <p class="question-text">${q.mainText}</p>
        </div>
        <input type="text" id="textAnswer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          placeholder="Scrivi qui in hiragana o kanji..."
          style="width:100%; padding:14px; font-size:18px; border-radius:10px; border:1.5px solid #e0ddd6; margin-bottom:12px;">
        <button id="submitBtn">Controlla</button>
        <div class="feedback" id="feedback"></div>
        <button id="nextBtn" class="hidden">Prossima domanda</button>
      `;

      const input = document.getElementById("textAnswer");
      input.focus();

      const checkAnswer = () => {
        if (state.answered) return;
        const typed = input.value.trim();
        if (!typed) return;
        state.answered = true;
        input.disabled = true;
        document.getElementById("submitBtn").disabled = true;
        const isCorrect = q.acceptedAnswers.includes(typed);
        const feedback = document.getElementById("feedback");
        if (isCorrect) {
          state.score++;
          feedback.textContent = `Corretto! Risposta corretta: ${q.displayAnswer}`;
          feedback.className = "feedback correct";
        } else {
          feedback.textContent = `Sbagliato — risposta corretta: ${q.displayAnswer}`;
          feedback.className = "feedback wrong";
        }
        document.getElementById("nextBtn").classList.remove("hidden");
      };

      document.getElementById("submitBtn").onclick = checkAnswer;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") checkAnswer();
      });

      document.getElementById("nextBtn").onclick = () => {
        if (state.idx + 1 >= state.questions.length) {
          saveResult(modeTitle(state.mode), state.score, state.questions.length);
          state.screen = "results";
        } else {
          state.idx++;
          state.answered = false;
        }
        render();
      };
      return;
    }

    app.innerHTML = `
      <div class="progress">
        <span>${progressLabel}</span>
        <span>Punteggio: ${state.score}</span>
      </div>
      <div class="question-box">
        <p class="question-hint">${q.promptLabel}</p>
        <p class="question-text">${q.mainText}</p>
        ${q.hintText ? `<p class="question-sub">${q.hintText}</p>` : ""}
      </div>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button id="nextBtn" class="hidden">Prossima domanda</button>
    `;

    const optsDiv = document.getElementById("options");
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => {
        if (state.answered) return;
        state.answered = true;
        const isCorrect = opt === q.correctValue;
        const feedback = document.getElementById("feedback");
        const explanationHtml = q.explanation ? `<div style="margin-top:6px; font-weight:400; color:var(--text-secondary,#7a7a76);">${q.explanation}</div>` : "";
        if (isCorrect) {
          btn.classList.add("correct");
          state.score++;
          feedback.innerHTML = "Corretto!" + explanationHtml;
          feedback.className = "feedback correct";
        } else {
          btn.classList.add("wrong");
          feedback.innerHTML = `Sbagliato — risposta giusta: ${q.correctValue}` + explanationHtml;
          feedback.className = "feedback wrong";
          [...optsDiv.children].forEach(c => {
            if (c.textContent === q.correctValue) c.classList.add("correct");
          });
        }
        document.getElementById("nextBtn").classList.remove("hidden");
      };
      optsDiv.appendChild(btn);
    });

    document.getElementById("nextBtn").onclick = () => {
      if (state.idx + 1 >= state.questions.length) {
        saveResult(modeTitle(state.mode), state.score, state.questions.length);
        state.screen = "results";
      } else {
        state.idx++;
        state.answered = false;
      }
      render();
    };
    return;
  }

  if (state.screen === "results") {
    const pct = Math.round((state.score / state.questions.length) * 100);
    app.innerHTML = `
      <h1>Risultati &mdash; ${modeTitle(state.mode)}</h1>
      <div class="card">
        <div class="score-big">${state.score} / ${state.questions.length}</div>
        <div class="score-label">${pct}% corrette</div>
        <button id="retryBtn">Rifai con nuove domande</button>
        <div style="height:10px"></div>
        <button id="setupBtn" class="secondary">Cambia numero di domande</button>
        <div style="height:10px"></div>
        <button id="menuBtn" class="secondary">Torna al menu</button>
      </div>
    `;
    document.getElementById("retryBtn").onclick = () => {
      state.questions = buildQuestions(state.mode, state.totalItems);
      state.idx = 0;
      state.score = 0;
      state.answered = false;
      state.screen = "quiz";
      render();
    };
    document.getElementById("setupBtn").onclick = () => {
      state.screen = "setup";
      render();
    };
    document.getElementById("menuBtn").onclick = () => {
      state.screen = "mode";
      render();
    };
    return;
  }
}

render();
</script>
</body>
</html>
